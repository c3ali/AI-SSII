groups:
  - name: database_alerts
    interval: 30s
    rules:
      # PostgreSQL Down
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 2 minutes"

      # Too Many Connections
      - alert: PostgreSQLTooManyConnections
        expr: |
          sum(pg_stat_database_numbackends) > 100
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "PostgreSQL has {{ $value }} connections (threshold: 100)"

      # High Connection Usage
      - alert: PostgreSQLHighConnectionUsage
        expr: |
          (
            sum(pg_stat_database_numbackends)
            /
            pg_settings_max_connections
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection usage is high"
          description: "{{ $value | humanizePercentage }} of max connections in use"

      # Slow Queries
      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_activity_max_tx_duration{state="active"}[5m]) > 60
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL has slow queries"
          description: "Queries taking longer than 60 seconds detected"

      # Replication Lag
      - alert: PostgreSQLReplicationLag
        expr: |
          pg_replication_lag > 30
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL replication lag detected"
          description: "Replication lag is {{ $value }} seconds (threshold: 30s)"

      # Disk Space Low
      - alert: PostgreSQLDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{job="postgres", mountpoint="/var/lib/postgresql"}
            /
            node_filesystem_size_bytes{job="postgres", mountpoint="/var/lib/postgresql"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL disk space is low"
          description: "Only {{ $value }}% disk space remaining"

      # Deadlocks Detected
      - alert: PostgreSQLDeadlocks
        expr: |
          rate(pg_stat_database_deadlocks[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{ $value }} deadlocks per second detected"
