version: '3.8'

services:
  # API FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssii-ia-api
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: SSII-IA-Platform
      ENVIRONMENT: development
      DEBUG: "True"
      API_HOST: 0.0.0.0
      API_PORT: 8000

      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001

      # OpenAI (à configurer)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key-here}
      OPENAI_MODEL: gpt-4-turbo-preview

      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ssii_ia_platform

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars

      # Logging
      LOG_LEVEL: INFO
      LOG_FORMAT: json

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    restart: unless-stopped
    networks:
      - ssii-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ssii-ia-db
    environment:
      POSTGRES_DB: ssii_ia_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ssii-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ssii-ia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ssii-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ssii-network:
    driver: bridge
