name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PREVIEW_API_URL }}

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        id: vercel-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: true

      - name: Deploy API to Railway Preview
        run: |
          npm install -g @railway/cli
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service api --environment preview
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run preview tests
        run: |
          sleep 30
          curl -f ${{ steps.vercel-preview.outputs.preview-url }}/api/health
          echo "✅ Preview deployment successful"

      - name: Run Lighthouse on Preview
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ steps.vercel-preview.outputs.preview-url }}
            ${{ steps.vercel-preview.outputs.preview-url }}/projects
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with details
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🚀 Preview Deployment Ready!

            ### Deployments
            - **Frontend**: ${{ steps.vercel-preview.outputs.preview-url }}
            - **API**: ${{ secrets.PREVIEW_API_URL }}

            ### Quick Actions
            - [View Preview](${{ steps.vercel-preview.outputs.preview-url }})
            - [View Build Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Test Checklist
            - [ ] UI/UX review
            - [ ] Functionality testing
            - [ ] Performance check
            - [ ] Mobile responsiveness

            ---
            *Preview will be updated automatically with new commits*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: deploy-preview
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Run visual regression tests
        run: pnpm test:visual
        continue-on-error: true

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: visual-regression-report
          path: test-results/
          retention-days: 30
